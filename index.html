<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicVerse HQ</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #13151f;
      --accent: #ff2a2a;
      --accent-hover: #ff4d4d;
      --text-main: #f0f2f5;
      --text-muted: #8b92a5;
      --border: #1e2235;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }

    header {
      background: rgba(19, 21, 31, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.25rem; font-weight: 800; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }

    .search-wrapper {
      padding: 20px 16px 10px;
      max-width: 650px;
      margin: 0 auto;
    }
    .search-container {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.2s;
    }
    .search-container:focus-within { border-color: var(--accent); }
    .search-container input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 18px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }
    .search-container button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 22px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-container button:hover { background: var(--accent-hover); }

    .section-header {
      max-width: 1300px;
      margin: 20px auto 10px;
      padding: 0 20px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Grid de Cómics Estilo Tarjeta Moderna */
    .comic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      padding: 10px 20px 40px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .comic-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .comic-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border-color: rgba(255, 42, 42, 0.4);
    }
    .comic-poster {
      width: 100%;
      height: 220px;
      background: #0d0e14;
      position: relative;
      overflow: hidden;
    }
    .comic-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .comic-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .comic-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Visor de Lectura Inmersivo */
    #reader-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 100;
      overflow-y: auto;
      display: none;
    }
    .reader-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 101;
      border-bottom: 1px solid var(--border);
    }
    .reader-header span {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .close-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .reader-content {
      padding-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .reader-content img {
      width: 100%;
      max-width: 800px;
      height: auto;
      display: block;
    }
    .loading-state {
      text-align: center;
      padding: 100px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ ComicVerse HQ</h1>
  </header>

  <div class="search-wrapper">
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Escribe el nombre del cómic (Ej: Invincible, Batman)...">
      <button onclick="ejecutarBusqueda()">Buscar</button>
    </div>
  </div>

  <div class="section-header" id="sectionTitle">🔥 CÓMICS DESTACADOS</div>

  <main class="comic-grid" id="comicGrid"></main>

  <!-- Visor -->
  <div id="reader-modal">
    <div class="reader-header">
      <span id="readerTitle">Cargando...</span>
      <button class="close-btn" onclick="cerrarVisor()">Cerrar</button>
    </div>
    <div class="loading-state" id="readerLoading">Cargando páginas del capítulo...</div>
    <div class="reader-content" id="readerContainer"></div>
  </div>

  <script>
    const BACKEND_URL = "https://literate-octo-palm-tree-07j5.onrender.com";

    window.addEventListener('DOMContentLoaded', cargarDestacados);

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') ejecutarBusqueda();
    });

    async function cargarDestacados() {
      const grid = document.getElementById('comicGrid');
      grid.innerHTML = '<div class="loading-state" style="grid-column: 1/-1;">Cargando catálogo inicial...</div>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/destacados`);
        const data = await res.json();
        renderizarComics(data);
      } catch (e) {
        grid.innerHTML = '<div class="loading-state" style="grid-column: 1/-1;">Usa la barra de búsqueda para encontrar cómics.</div>';
      }
    }

    async function ejecutarBusqueda() {
      const query = document.getElementById('searchInput').value.trim();
      const grid = document.getElementById('comicGrid');
      const sectionTitle = document.getElementById('sectionTitle');

      if (!query) return;

      sectionTitle.innerText = `🔍 RESULTADOS PARA: "${query.toUpperCase()}"`;
      grid.innerHTML = '<div class="loading-state" style="grid-column: 1/-1;">Buscando en los servidores...</div>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/buscar?query=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderizarComics(data);
      } catch (e) {
        grid.innerHTML = '<div class="loading-state" style="grid-column: 1/-1;">Error de conexión con el servidor backend.</div>';
      }
    }

    function renderizarComics(lista) {
      const grid = document.getElementById('comicGrid');
      grid.innerHTML = "";

      if (!lista || lista.length === 0) {
        grid.innerHTML = '<div class="loading-state" style="grid-column: 1/-1;">No se encontraron cómics con ese nombre.</div>';
        return;
      }

      lista.forEach(item => {
        const card = document.createElement('div');
        card.className = 'comic-card';
        
        const imgUrl = item.portada.startsWith('http') ? item.portada : `${BACKEND_URL}${item.portada}`;
        
        card.innerHTML = `
          <div class="comic-poster">
            <img src="${imgUrl}" alt="${item.titulo}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Imagen'">
          </div>
          <div class="comic-info">
            <div class="comic-title">${item.titulo}</div>
          </div>
        `;
        
        card.onclick = () => abrirCapitulo(item.link, item.titulo);
        grid.appendChild(card);
      });
    }

    async function abrirCapitulo(urlCapitulo, titulo) {
      document.getElementById('reader-modal').style.display = 'block';
      document.getElementById('readerLoading').style.display = 'block';
      document.getElementById('readerTitle').innerText = titulo;
      const container = document.getElementById('readerContainer');
      container.innerHTML = '';

      try {
        const res = await fetch(`${BACKEND_URL}/api/capitulo?url_capitulo=${encodeURIComponent(urlCapitulo)}`);
        const data = await res.json();
        
        document.getElementById('readerLoading').style.display = 'none';

        if (!data.paginas || data.paginas.length === 0) {
          container.innerHTML = '<div class="loading-state">No se pudieron extraer las páginas de este capítulo.</div>';
          return;
        }

        data.paginas.forEach(imgUrl => {
          const fullImgUrl = imgUrl.startsWith('http') ? imgUrl : `${BACKEND_URL}${imgUrl}`;
          container.innerHTML += `<img src="${fullImgUrl}" loading="lazy" onerror="this.remove()">`;
        });

      } catch (e) {
        document.getElementById('readerLoading').innerText = "Error cargando las páginas.";
      }
    }

    function cerrarVisor() {
      document.getElementById('reader-modal').style.display = 'none';
      document.getElementById('readerContainer').innerHTML = '';
    }
  </script>
</body>
</html>
