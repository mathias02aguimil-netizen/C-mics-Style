<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Colección de Cómics</title>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
    header { background-color: #1f1f1f; padding: 15px; border-bottom: 2px solid #e50914; }
    h1 { margin: 0; font-size: 1.5rem; }
    .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px; }
    .card { background-color: #2a2a2a; border-radius: 8px; width: 140px; padding: 10px; cursor: pointer; transition: transform 0.2s; }
    .card:active { transform: scale(0.95); }
    .card img { width: 100%; border-radius: 5px; height: 190px; object-fit: cover; }
    .card h3 { font-size: 0.9rem; margin: 8px 0 0 0; }
    
    /* Visor de lectura */
    #visor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .oculto { display: none !important; }
    #pagina-img { max-height: 75vh; max-width: 95vw; border-radius: 4px; }
    .controles { margin-top: 15px; display: flex; gap: 15px; align-items: center; }
    .btn { padding: 12px 20px; background-color: #e50914; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; }
    .btn-cerrar { position: absolute; top: 15px; right: 15px; background: #333; }
    #num-pagina { font-size: 0.9rem; color: #aaa; }
  </style>
</head>
<body>

  <header>
    <h1>📖 Mi Lector de Cómics</h1>
  </header>

  <div class="galeria">
    <!-- CÓMIC 1 (Ejemplo) -->
    <!-- Cambia 'comic1' por el nombre de tu carpeta y '10' por el total de páginas -->
    <div class="card" onclick="abrirComic('comic1', 10)">
      <img src="comics/comic1/pag1.jpg" alt="Portada">
      <h3>Mi Primer Cómic</h3>
    </div>
  </div>

  <!-- VISOR (Se abre al tocar un cómic) -->
  <div id="visor" class="oculto">
    <button class="btn btn-cerrar" onclick="cerrarVisor()">✖</button>
    <img id="pagina-img" src="" alt="Cargando página...">
    <div class="controles">
      <button class="btn" onclick="cambiarPagina(-1)">◀ Prev</button>
      <span id="num-pagina">1</span>
      <button class="btn" onclick="cambiarPagina(1)">Next ▶</button>
    </div>
  </div>

  <script>
    let comicActual = '';
    let paginaActual = 1;
    let totalPaginas = 0;

    function abrirComic(nombreCarpeta, total) {
      comicActual = nombreCarpeta;
      totalPaginas = total;
      paginaActual = 1;
      cargarImagen();
      document.getElementById('visor').classList.remove('oculto');
    }

    function cargarImagen() {
      document.getElementById('pagina-img').src = `comics/${comicActual}/pag${paginaActual}.jpg`;
      document.getElementById('num-pagina').innerText = `${paginaActual} / ${totalPaginas}`;
    }

    function cambiarPagina(dir) {
      paginaActual += dir;
      if (paginaActual < 1) paginaActual = 1;
      if (paginaActual > totalPaginas) paginaActual = totalPaginas;
      cargarImagen();
    }

    function cerrarVisor() {
      document.getElementById('visor').classList.add('oculto');
    }
  </script>
</body>
</html>
