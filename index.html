<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicVerse HQ</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --accent: #ff2a5f;
            --text-main: #f0f2f5;
            --text-sub: #9aa0a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        header {
            padding: 16px;
            background: rgba(11, 14, 20, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #1e2430;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #2a3140;
            background: #151922;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 18px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: #1a202c;
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            border: 1px solid #2d3748;
        }

        .container {
            padding: 16px;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #fff;
        }

        .grid-comics {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
        }

        @media (min-width: 600px) {
            .grid-comics {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 20px;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #1e2430;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.97);
        }

        .cover-wrapper {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #1e2430;
            position: relative;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.25;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #reader-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 200;
            overflow-y: auto;
        }

        .reader-header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.85);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .reader-pages {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-bottom: 40px;
        }

        .reader-pages img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }

        .btn-close {
            background: #ff2a5f;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ ComicVerse HQ</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar cómic (ej. Spider-Man)...">
            <button onclick="ejecutarBusqueda()">Buscar</button>
        </div>
    </header>

    <div class="categories">
        <button class="cat-btn" onclick="buscarCategoria('Spider-Man')">🕷️ Spider-Man</button>
        <button class="cat-btn" onclick="buscarCategoria('Batman')">🦇 Batman</button>
        <button class="cat-btn" onclick="buscarCategoria('Avengers')">⭐ Avengers</button>
        <button class="cat-btn" onclick="buscarCategoria('X-Men')">🧬 X-Men</button>
        <button class="cat-btn" onclick="buscarCategoria('Superman')">🦸 Superman</button>
    </div>

    <div class="container">
        <h2 class="section-title" id="tituloSeccion">🔥 Cómics Destacados</h2>
        <div class="grid-comics" id="gridComics">
            <div class="loader">Cargando cómics...</div>
        </div>
    </div>

    <div id="reader-view">
        <div class="reader-header">
            <span id="reader-title" style="font-weight:600; font-size:0.9rem;">Leyendo Cómic</span>
            <button class="btn-close" onclick="cerrarLector()">Cerrar</button>
        </div>
        <div class="reader-pages" id="readerPages"></div>
    </div>

    <script>
        const RENDER_URL = "https://literate-octo-palm-tree-07j5.onrender.com";

        async function cargarDestacados() {
            fetchComics(`${RENDER_URL}/api/destacados`);
        }

        function ejecutarBusqueda() {
            const query = document.getElementById("searchInput").value;
            if (query.trim()) {
                document.getElementById("tituloSeccion").innerText = `Resultados para: "${query}"`;
                fetchComics(`${RENDER_URL}/api/buscar?query=${encodeURIComponent(query)}`);
            }
        }

        function buscarCategoria(cat) {
            document.getElementById("searchInput").value = cat;
            ejecutarBusqueda();
        }

        async function fetchComics(url) {
            const grid = document.getElementById("gridComics");
            grid.innerHTML = '<div class="loader">Cargando resultados... (Servidor despertando)</div>';
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                grid.innerHTML = "";
                if (data.length === 0) {
                    grid.innerHTML = '<div class="loader">No se encontraron cómics.</div>';
                    return;
                }

                data.forEach(item => {
                    const portadaUrl = item.portada.startsWith("/") ? `${RENDER_URL}${item.portada}` : item.portada;
                    
                    const card = document.createElement("div");
                    card.className = "card";
                    card.onclick = () => abrirLector(item.link, item.titulo);
                    card.innerHTML = `
                        <div class="cover-wrapper">
                            <img src="${portadaUrl}" alt="${item.titulo}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
                        </div>
                        <div class="card-info">
                            <div class="card-title">${item.titulo}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                grid.innerHTML = '<div class="loader">Error al conectar con el servidor. Si estuvo inactivo, recarga en 30 segundos.</div>';
            }
        }

        async function abrirLector(linkCapitulo, titulo) {
            const reader = document.getElementById("reader-view");
            const pagesContainer = document.getElementById("readerPages");
            document.getElementById("reader-title").innerText = titulo;
            
            pagesContainer.innerHTML = '<div class="loader" style="color:#fff">Cargando páginas del cómic...</div>';
            reader.style.display = "block";

            try {
                const res = await fetch(`${RENDER_URL}/api/capitulo?url_capitulo=${encodeURIComponent(linkCapitulo)}`);
                const data = await res.json();

                pagesContainer.innerHTML = "";
                if (!data.paginas || data.paginas.length === 0) {
                    pagesContainer.innerHTML = '<div class="loader" style="color:#fff">No se pudieron extraer las páginas de este capítulo.</div>';
                    return;
                }

                data.paginas.forEach(imgUrl => {
                    const fullUrl = imgUrl.startsWith("/") ? `${RENDER_URL}${imgUrl}` : imgUrl;
                    const img = document.createElement("img");
                    img.src = fullUrl;
                    img.loading = "lazy";
                    pagesContainer.appendChild(img);
                });
            } catch (e) {
                pagesContainer.innerHTML = '<div class="loader" style="color:#fff">Error al cargar las páginas.</div>';
            }
        }

        function cerrarLector() {
            document.getElementById("reader-view").style.display = "none";
            document.getElementById("readerPages").innerHTML = "";
        }

        window.onload = cargarDestacados;
    </script>
</body>
</html>
