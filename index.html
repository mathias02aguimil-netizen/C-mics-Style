<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicVerse HQ</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #141419;
      --accent: #e50914;
      --text: #ffffff;
      --subtext: #a0a0ab;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    
    header { 
      background: rgba(20, 20, 25, 0.9); 
      backdrop-filter: blur(10px);
      padding: 16px; 
      text-align: center; 
      border-bottom: 1px solid #22222b; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
    }
    header h1 { font-size: 1.4rem; color: var(--accent); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

    .search-box { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; gap: 10px; }
    .search-box input { 
      flex: 1; 
      padding: 14px 18px; 
      border-radius: 12px; 
      border: 1px solid #2a2a35; 
      background: #141419; 
      color: #fff; 
      outline: none; 
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box button { 
      background: var(--accent); 
      color: #fff; 
      border: none; 
      padding: 14px 20px; 
      border-radius: 12px; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
    }

    .status-msg { text-align: center; color: var(--subtext); margin: 15px 0; font-size: 0.9rem; font-weight: 500; }

    /* Grid de cómics */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
      gap: 16px; 
      padding: 16px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    .card { 
      background: var(--card-bg); 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #22222b; 
      cursor: pointer; 
      transition: transform 0.2s, box-shadow 0.2s; 
      display: flex; 
      flex-direction: column; 
    }
    .card:active { transform: scale(0.96); }
    .card-img-wrapper { position: relative; width: 100%; height: 210px; background: #1a1a22; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
    .card .title { font-size: 0.85rem; font-weight: 700; line-height: 1.3; color: #eee; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Visor de Lectura Continuo */
    #visor { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; overflow-y: auto; display: none; }
    .top-bar { 
      position: fixed; 
      top: 0; left: 0; right: 0; 
      background: rgba(10, 10, 12, 0.95); 
      backdrop-filter: blur(8px);
      padding: 12px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 101; 
      border-bottom: 1px solid #1a1a22; 
    }
    .top-bar span { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; color: #fff; }
    .btn-cerrar { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    
    .paginas-container { padding-top: 60px; display: flex; flex-direction: column; align-items: center; background: #000; }
    .paginas-container img { width: 100%; max-width: 850px; height: auto; display: block; border-bottom: 1px solid #111; }
    #visor-loading { text-align: center; padding: 120px 20px; color: var(--subtext); font-size: 1rem; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ COMICVERSE HQ</h1>
  </header>

  <div class="search-box">
    <input type="text" id="input-busqueda" placeholder="Buscar cómic o personaje...">
    <button onclick="ejecutarBusqueda()">Buscar</button>
  </div>

  <div id="status" class="status-msg">Ingresa un nombre para explorar la biblioteca</div>

  <main class="grid" id="catalogo"></main>

  <!-- Visor de Lectura Completa -->
  <div id="visor">
    <div class="top-bar">
      <span id="titulo-comic">Cargando lectura...</span>
      <button class="btn-cerrar" onclick="cerrarVisor()">✖ Cerrar</button>
    </div>
    <div id="visor-loading">⏳ Obteniendo páginas del cómic...</div>
    <div class="paginas-container" id="contenedor-paginas"></div>
  </div>

  <script>
    const SERVIDOR = "https://literate-octo-palm-tree-07j5.onrender.com";

    document.getElementById('input-busqueda').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') ejecutarBusqueda();
    });

    async function ejecutarBusqueda() {
      const query = document.getElementById('input-busqueda').value.trim();
      const status = document.getElementById('status');
      const catalogo = document.getElementById('catalogo');

      if (!query) return;

      status.innerText = "🔎 Conectando con la base de datos...";
      catalogo.innerHTML = "";

      try {
        const res = await fetch(`${SERVIDOR}/api/buscar?query=${encodeURIComponent(query)}`);
        const resultados = await res.json();

        if (resultados.length === 0) {
          status.innerText = "No se encontraron cómics disponibles con ese nombre.";
          return;
        }

        status.innerText = `Catálogo listo: ${resultados.length} resultados disponibles`;

        resultados.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          
          const imgUrl = item.portada.startsWith('http') ? item.portada : `${SERVIDOR}${item.portada}`;
          
          card.innerHTML = `
            <div class="card-img-wrapper">
              <img src="${imgUrl}" alt="${item.titulo}" onerror="this.src='https://via.placeholder.com/200x300?text=Comic'">
            </div>
            <div class="card-info">
              <div class="title">${item.titulo}</div>
            </div>
          `;
          
          card.onclick = () => abrirCapitulo(item.link, item.titulo);
          catalogo.appendChild(card);
        });

      } catch (e) {
        status.innerText = " Error al conectar con el servidor central.";
      }
    }

    async function abrirCapitulo(urlCapitulo, titulo) {
      document.getElementById('visor').style.display = 'block';
      document.getElementById('visor-loading').style.display = 'block';
      document.getElementById('titulo-comic').innerText = titulo;
      const contenedor = document.getElementById('contenedor-paginas');
      contenedor.innerHTML = '';

      try {
        const res = await fetch(`${SERVIDOR}/api/capitulo?url_capitulo=${encodeURIComponent(urlCapitulo)}`);
        const data = await res.json();
        
        document.getElementById('visor-loading').style.display = 'none';

        if (!data.paginas || data.paginas.length === 0) {
          contenedor.innerHTML = '<div style="padding: 60px 20px; text-align: center; color: #888;">Este tomo no cuenta con páginas disponibles temporalmente.</div>';
          return;
        }

        data.paginas.forEach(imgUrl => {
          const fullImgUrl = imgUrl.startsWith('http') ? imgUrl : `${SERVIDOR}${imgUrl}`;
          contenedor.innerHTML += `<img src="${fullImgUrl}" loading="lazy">`;
        });

      } catch (e) {
        document.getElementById('visor-loading').innerText = "Error al procesar el archivo del cómic.";
      }
    }

    function cerrarVisor() {
      document.getElementById('visor').style.display = 'none';
      document.getElementById('contenedor-paginas').innerHTML = '';
    }
  </script>
</body>
</html>
