<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómics Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f11; color: #ffffff; }

    /* Cabecera estilo App */
    header { position: sticky; top: 0; z-index: 10; background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(10px); padding: 15px; border-bottom: 1px solid #222; text-align: center; }
    header h1 { font-size: 1.2rem; color: #e50914; font-weight: 800; letter-spacing: 1px; }

    /* Buscador */
    .search-box { padding: 12px 15px; }
    .search-box input { width: 100%; padding: 10px 15px; background: #1a1a1e; border: 1px solid #2a2a30; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; }

    /* Grilla de Cómics */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 15px; }
    .card { background: #1a1a1e; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #282830; }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card .info { padding: 8px; }
    .card .info h3 { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eee; }
    .card .info p { font-size: 0.7rem; color: #888; margin-top: 2px; }

    /* Visor Modo Cascada (Scroll Vertical) */
    #visor { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; overflow-y: auto; display: none; }
    .visor-bar { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 101; border-bottom: 1px solid #333; }
    .visor-bar h2 { font-size: 0.95rem; font-weight: 600; }
    .btn-close { background: #e50914; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .paginas-container { padding-top: 55px; padding-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
    .paginas-container img { width: 100%; max-width: 800px; display: block; margin: 0 auto; height: auto; }
  </style>
</head>
<body>

  <header>
    <h1>Marmota Reader</h1>
  </header>

  <div class="search-box">
    <input type="text" id="busqueda" placeholder="Buscar cómic..." oninput="filtrarComics()">
  </div>

  <main class="grid" id="catalogo">
    <!-- Se genera automáticamente desde el JSON -->
  </main>

  <!-- Lector Vertical -->
  <div id="visor">
    <div class="visor-bar">
      <h2 id="visor-titulo">Leyendo Cómic</h2>
      <button class="btn-close" onclick="cerrarVisor()">Cerrar ✖</button>
    </div>
    <div class="paginas-container" id="paginas-lista"></div>
  </div>

  <script>
    let todosLosComics = [];

    // Cargar la lista de cómics desde el archivo JSON
    async function cargarCatalogo() {
      try {
        const res = await fetch('comics.json');
        todosLosComics = await res.json();
        mostrarComics(todosLosComics);
      } catch (e) {
        console.error("Error al cargar comics.json", e);
      }
    }

    function mostrarComics(lista) {
      const contenedor = document.getElementById('catalogo');
      contenedor.innerHTML = '';
      lista.forEach((comic, idx) => {
        contenedor.innerHTML += `
          <div class="card" onclick="abrirComic(${idx})">
            <img src="${comic.portada}" alt="Portada">
            <div class="info">
              <h3>${comic.titulo}</h3>
              <p>${comic.capitulo || 'Tomo 1'}</p>
            </div>
          </div>
        `;
      });
    }

    function filtrarComics() {
      const texto = document.getElementById('busqueda').value.toLowerCase();
      const filtrados = todosLosComics.filter(c => c.titulo.toLowerCase().includes(texto));
      mostrarComics(filtrados);
    }

    function abrirComic(index) {
      const comic = todosLosComics[index];
      document.getElementById('visor-titulo').innerText = comic.titulo;
      const listaImg = document.getElementById('paginas-lista');
      listaImg.innerHTML = '';

      comic.paginas.forEach(url => {
        listaImg.innerHTML += `<img src="${url}" loading="lazy" alt="Página">`;
      });

      document.getElementById('visor').style.display = 'block';
      document.getElementById('visor').scrollTop = 0;
    }

    function cerrarVisor() {
      document.getElementById('visor').style.display = 'none';
    }

    window.onload = cargarCatalogo;
  </script>
</body>
</html>
