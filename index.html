<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicVerse HQ</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #141419;
      --accent: #e50914;
      --text: #ffffff;
      --subtext: #8e8e93;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    
    header { 
      background: #141419; 
      padding: 16px; 
      text-align: center; 
      border-bottom: 1px solid #22222b; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
    }
    header h1 { font-size: 1.4rem; color: var(--accent); font-weight: 900; letter-spacing: 2px; }

    .search-box { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; gap: 8px; }
    .search-box input { 
      flex: 1; 
      padding: 14px 16px; 
      border-radius: 10px; 
      border: 1px solid #282c3d; 
      background: #14161d; 
      color: #fff; 
      outline: none; 
      font-size: 1rem;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box button { 
      background: var(--accent); 
      color: #fff; 
      border: none; 
      padding: 14px 20px; 
      border-radius: 10px; 
      font-weight: 700; 
      cursor: pointer; 
    }

    .section-title { font-size: 1.1rem; font-weight: 800; margin: 15px 20px 5px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

    /* Grid de Cómics */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
      gap: 15px; 
      padding: 15px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    .card { 
      background: var(--card-bg); 
      border-radius: 10px; 
      overflow: hidden; 
      border: 1px solid #232633; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column;
    }
    .card-img-container { width: 100%; height: 210px; background: #1c1d24; overflow: hidden; position: relative; }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-info { padding: 12px; background: #141419; min-height: 55px; }
    .card .title { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: #ffffff !important; 
      line-height: 1.3; 
      display: -webkit-box; 
      -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; 
      overflow: hidden; 
    }

    /* Visor de Lectura */
    #visor { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; overflow-y: auto; display: none; }
    .top-bar { 
      position: fixed; 
      top: 0; left: 0; right: 0; 
      background: rgba(10, 10, 12, 0.95); 
      padding: 12px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 101; 
      border-bottom: 1px solid #222; 
    }
    .top-bar span { font-size: 0.9rem; font-weight: 700; color: #fff; max-width: 75%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-cerrar { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    
    .paginas-container { padding-top: 55px; display: flex; flex-direction: column; align-items: center; }
    .paginas-container img { width: 100%; max-width: 850px; height: auto; display: block; border-bottom: 2px solid #111; }
    #visor-loading { text-align: center; padding: 120px 20px; color: var(--subtext); }
  </style>
</head>
<body>

  <header>
    <h1>⚡ COMICVERSE HQ</h1>
  </header>

  <div class="search-box">
    <input type="text" id="input-busqueda" placeholder="Buscar título o superhéroe...">
    <button onclick="ejecutarBusqueda()">Buscar</button>
  </div>

  <div class="section-title" id="titulo-seccion">🔥 RECOMENDADOS DE HOY</div>

  <main class="grid" id="catalogo"></main>

  <!-- Visor de Lectura Completo -->
  <div id="visor">
    <div class="top-bar">
      <span id="titulo-comic">Cargando...</span>
      <button class="btn-cerrar" onclick="cerrarVisor()">✖ Cerrar</button>
    </div>
    <div id="visor-loading">⏳ Obteniendo páginas reales del capítulo...</div>
    <div class="paginas-container" id="contenedor-paginas"></div>
  </div>

  <script>
    const SERVIDOR = "https://literate-octo-palm-tree-07j5.onrender.com";

    window.addEventListener('DOMContentLoaded', cargarDestacados);

    document.getElementById('input-busqueda').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') ejecutarBusqueda();
    });

    async function cargarDestacados() {
      const catalogo = document.getElementById('catalogo');
      catalogo.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: #888;'>Cargando biblioteca inicial...</div>";

      try {
        const res = await fetch(`${SERVIDOR}/api/destacados`);
        const resultados = await res.json();
        renderizarCards(resultados);
      } catch (e) {
        catalogo.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: #888;'>No se pudieron cargar los cómics iniciales. Usa el buscador.</div>";
      }
    }

    async function ejecutarBusqueda() {
      const query = document.getElementById('input-busqueda').value.trim();
      const catalogo = document.getElementById('catalogo');
      const tituloSeccion = document.getElementById('titulo-seccion');

      if (!query) return;

      tituloSeccion.innerText = `🔍 RESULTADOS DE: ${query.toUpperCase()}`;
      catalogo.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: #888;'>Buscando cómics...</div>";

      try {
        const res = await fetch(`${SERVIDOR}/api/buscar?query=${encodeURIComponent(query)}`);
        const resultados = await res.json();
        renderizarCards(resultados);
      } catch (e) {
        catalogo.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: #888;'>Error al conectar con el servidor.</div>";
      }
    }

    function renderizarCards(lista) {
      const catalogo = document.getElementById('catalogo');
      catalogo.innerHTML = "";

      if (!lista || lista.length === 0) {
        catalogo.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: #888;'>No se encontraron títulos.</div>";
        return;
      }

      lista.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const imgUrl = item.portada.startsWith('http') ? item.portada : `${SERVIDOR}${item.portada}`;
        
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgUrl}" alt="${item.titulo}" onerror="this.src='https://via.placeholder.com/200x300?text=Comic'">
          </div>
          <div class="card-info">
            <div class="title">${item.titulo || 'Cómic sin título'}</div>
          </div>
        `;
        
        card.onclick = () => abrirCapitulo(item.link, item.titulo);
        catalogo.appendChild(card);
      });
    }

    async function abrirCapitulo(urlCapitulo, titulo) {
      document.getElementById('visor').style.display = 'block';
      document.getElementById('visor-loading').style.display = 'block';
      document.getElementById('titulo-comic').innerText = titulo || "Lectura de Cómic";
      const contenedor = document.getElementById('contenedor-paginas');
      contenedor.innerHTML = '';

      try {
        const res = await fetch(`${SERVIDOR}/api/capitulo?url_capitulo=${encodeURIComponent(urlCapitulo)}`);
        const data = await res.json();
        
        document.getElementById('visor-loading').style.display = 'none';

        if (!data.paginas || data.paginas.length === 0) {
          contenedor.innerHTML = '<div style="padding: 60px 20px; text-align: center; color: #888;">No se encontraron las páginas de este capítulo.</div>';
          return;
        }

        data.paginas.forEach(imgUrl => {
          const fullImgUrl = imgUrl.startsWith('http') ? imgUrl : `${SERVIDOR}${imgUrl}`;
          contenedor.innerHTML += `<img src="${fullImgUrl}" loading="lazy">`;
        });

      } catch (e) {
        document.getElementById('visor-loading').innerText = "Error al cargar las páginas del capítulo.";
      }
    }

    function cerrarVisor() {
      document.getElementById('visor').style.display = 'none';
      document.getElementById('contenedor-paginas').innerHTML = '';
    }
  </script>
</body>
</html>
