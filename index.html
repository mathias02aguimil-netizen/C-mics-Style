<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMICVERSE HQ — Universo de Cómics</title>
    <!-- Fuentes de Google Modernas y Estilo Cómic -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --primary: #ff3366;
            --primary-hover: #ff1950;
            --accent: #00f2fe;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-comic: 'Bangers', cursive, sans-serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER / NAVBAR */
        header {
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            border-bottom: 3px solid var(--primary);
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(255, 51, 102, 0.3);
            position: relative;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            font-size: 2.5rem;
            animation: pulse-glow 2s infinite;
        }

        header h1 {
            font-family: var(--font-comic);
            font-size: 3rem;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 3px 3px 0px var(--primary);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* BUSCADOR Y CATEGORÍAS */
        .search-section {
            max-width: 700px;
            margin: 2rem auto 1rem;
            padding: 0 1rem;
            width: 100%;
        }

        .search-box {
            display: flex;
            background: var(--card-bg);
            border-radius: 50px;
            padding: 6px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            font-family: var(--font-sans);
        }

        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: var(--font-sans);
        }

        .search-box button:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        /* CHIPS DE CATEGORÍAS RÁPIDAS */
        .categories-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 1rem 20px;
            max-width: 800px;
            margin: 0 auto;
            scrollbar-width: none;
        }

        .categories-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .chip:hover, .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
        }

        /* CONTENIDO PRINCIPAL */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-family: var(--font-comic);
            font-size: 2rem;
            letter-spacing: 1px;
            margin: 1.5rem 0 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .grid-comics {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
            padding-bottom: 3rem;
        }

        .comic-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .comic-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 51, 102, 0.4);
        }

        .comic-thumb-container {
            width: 100%;
            height: 240px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .comic-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .comic-card:hover .comic-thumb-container img {
            transform: scale(1.08);
        }

        .comic-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .comic-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* LECTOR DE CAPÍTULOS / MODAL */
        #reader-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            overflow-y: auto;
        }

        .reader-header {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 1010;
        }

        .reader-title {
            font-weight: 600;
            font-size: 1rem;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .close-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .pages-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding-bottom: 5rem;
        }

        .pages-container img {
            width: 100%;
            height: auto;
            display: block;
            background: #111;
        }

        .loader {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--text-muted);
            font-family: var(--font-comic);
            letter-spacing: 1px;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--primary)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 15px var(--accent)); }
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: var(--card-bg);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="cargarDestacados()">
            <span class="logo-icon">⚡</span>
            <div>
                <h1>COMICVERSE HQ</h1>
                <p>Tu universo de cómics en línea</p>
            </div>
        </div>
    </header>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Busca tu cómic favorito (ej. Batman, Spider-Man)...">
            <button onclick="realizarBusqueda()">Buscar</button>
        </div>
    </div>

    <!-- Categorías rápidas -->
    <div class="categories-bar">
        <div class="chip active" onclick="filtrarCategoria('spider-man', this)">🔥 Spider-Man</div>
        <div class="chip" onclick="filtrarCategoria('batman', this)">🦇 Batman</div>
        <div class="chip" onclick="filtrarCategoria('avengers', this)">⭐ Avengers</div>
        <div class="chip" onclick="filtrarCategoria('x-men', this)">🧬 X-Men</div>
        <div class="chip" onclick="filtrarCategoria('deadpool', this)">🤪 Deadpool</div>
        <div class="chip" onclick="filtrarCategoria('star wars', this)">🚀 Star Wars</div>
    </div>

    <main>
        <h2 class="section-title" id="sectionTitle">🔥 CÓMICS DESTACADOS</h2>
        <div id="gridContainer" class="grid-comics">
            <!-- Los cómics se inyectarán aquí -->
            <div class="loader">Cargando universos paralelos... ⚡</div>
        </div>
    </main>

    <!-- Vista de Lector Interno -->
    <div id="reader-view">
        <div class="reader-header">
            <span class="reader-title" id="readerTitle">Cargando cómic...</span>
            <button class="close-btn" onclick="cerrarLector()">Cerrar ✕</button>
        </div>
        <div class="pages-container" id="pagesContainer">
            <div class="loader">Abriendo páginas... 📖</div>
        </div>
    </div>

    <footer>
        <p>COMICVERSE HQ &copy; 2026 — Hecho para verdaderos fans de los cómics.</p>
    </footer>

    <script>
        // URL de tu servidor en Render vinculada directamente
        const API_URL = "https://literate-octo-palm-tree-07j5.onrender.com";

        window.onload = () => {
            cargarDestacados();
            
            // Permitir buscar con la tecla Enter
            document.getElementById("searchInput").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    realizarBusqueda();
                }
            });
        };

        async function cargarDestacados() {
            document.getElementById("sectionTitle").innerHTML = "🔥 CÓMICS DESTACADOS";
            document.getElementById("searchInput").value = "";
            const grid = document.getElementById("gridContainer");
            grid.innerHTML = '<div class="loader">Buscando leyendas... ⚡</div>';

            try {
                const res = await fetch(`${API_URL}/api/destacados`);
                const data = await res.json();
                mostrarComics(data);
            } catch (err) {
                grid.innerHTML = '<div class="loader" style="color:var(--primary);">Error al conectar con el servidor 🛑</div>';
            }
        }

        async function realizarBusqueda() {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;

            document.getElementById("sectionTitle").innerHTML = `🔍 RESULTADOS PARA: "${query.toUpperCase()}"`;
            const grid = document.getElementById("gridContainer");
            grid.innerHTML = '<div class="loader">Viajando por el multiverso... 🌀</div>';

            try {
                const res = await fetch(`${API_URL}/api/buscar?query=${encodeURIComponent(query)}`);
                const data = await res.json();
                mostrarComics(data);
            } catch (err) {
                grid.innerHTML = '<div class="loader" style="color:var(--primary);">Error en la búsqueda 🛑</div>';
            }
        }

        function filtrarCategoria(termino, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            document.getElementById("searchInput").value = termino;
            realizarBusqueda();
        }

        function mostrarComics(comics) {
            const grid = document.getElementById("gridContainer");
            grid.innerHTML = "";

            if (!comics || comics.length === 0) {
                grid.innerHTML = '<div class="loader">No se encontraron cómics con ese nombre 😢</div>';
                return;
            }

            comics.forEach(comic => {
                const card = document.createElement("div");
                card.className = "comic-card";
                card.onclick = () => abrirCapitulo(comic.link, comic.titulo);

                card.innerHTML = `
                    <div class="comic-thumb-container">
                        <img src="${API_URL}${comic.portada}" alt="${comic.titulo}" onerror="this.src='https://via.placeholder.com/200x300?text=Comic+HQ'">
                    </div>
                    <div class="comic-info">
                        <div class="comic-title">${comic.titulo}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function abrirCapitulo(link, titulo) {
            const reader = document.getElementById("reader-view");
            const titleEl = document.getElementById("readerTitle");
            const container = document.getElementById("pagesContainer");

            titleEl.innerText = titulo;
            container.innerHTML = '<div class="loader">Revelando páginas secretas... 📖</div>';
            reader.style.display = "flex";

            try {
                const res = await fetch(`${API_URL}/api/capitulo?url_capitulo=${encodeURIComponent(link)}`);
                const data = await res.json();

                container.innerHTML = "";
                if (!data.paginas || data.paginas.length === 0) {
                    container.innerHTML = '<div class="loader">No se pudieron cargar las páginas de este capítulo 😕</div>';
                    return;
                }

                data.paginas.forEach(pag => {
                    const img = document.createElement("img");
                    img.src = `${API_URL}${pag}`;
                    img.loading = "lazy";
                    img.onerror = () => img.style.display = 'none';
                    container.appendChild(img);
                });
            } catch (err) {
                container.innerHTML = '<div class="loader" style="color:var(--primary);">Error al abrir el cómic 🛑</div>';
            }
        }

        function cerrarLector() {
            document.getElementById("reader-view").style.display = "none";
            document.getElementById("pagesContainer").innerHTML = "";
        }
    </script>
</body>
</html>
